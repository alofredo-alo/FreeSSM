name: Windows J2534 package

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt 5.15.2 and MinGW 8.1 x64
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 5.15.2 win64_mingw81 -O C:\Qt
          python -m aqt install-tool windows desktop tools_mingw qt.tools.win64_mingw810 -O C:\Qt
          "C:\Qt\5.15.2\mingw81_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Qt\Tools\mingw810_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build FreeSSM x64
        shell: pwsh
        run: |
          qmake.exe FreeSSM.pro "CONFIG+=release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lupdate.exe FreeSSM.pro -no-obsolete
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unfinished = Select-String -Path FreeSSM_es.ts -Pattern 'type="unfinished"'
          if ($unfinished) {
            $unfinished | ForEach-Object { Write-Error $_.Line }
            throw "FreeSSM_es.ts contains untranslated application strings."
          }
          mingw32-make.exe translation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mingw32-make.exe -j2 release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build J2534 broker x86
        shell: pwsh
        run: |
          ./scripts/build-j2534-broker.ps1 -OutputPath ./j2534_broker.exe

      - name: Assemble runtime package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist\FreeSSM-J2534-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $app = @(".\FreeSSM.exe", ".\release\FreeSSM.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $app) { throw "FreeSSM.exe was not produced." }
          Copy-Item $app (Join-Path $dist "FreeSSM.exe")
          Copy-Item .\j2534_broker.exe $dist
          Copy-Item .\background.png, .\LiberationSans-*.ttf, .\LICENSE.txt, `
            .\README.md, .\README.txt, .\README.J2534-Windows.md, `
            .\README.J2534-Windows.es.md $dist
          Copy-Item .\definitions $dist -Recurse
          $qtRoot = "C:\Qt\5.15.2\mingw81_64"
          $qtBinPath = Join-Path $qtRoot "bin"
          $qtPluginPath = Join-Path $qtRoot "plugins"
          $appTranslations = @(
            "FreeSSM_en.qm",
            "FreeSSM_de.qm",
            "FreeSSM_tr.qm",
            "FreeSSM_es.qm"
          )
          foreach ($translation in $appTranslations) {
            if (-not (Test-Path $translation)) {
              throw "Required application translation is missing: $translation"
            }
            Copy-Item $translation $dist
          }
          foreach ($language in @("de", "tr", "es")) {
            $qtTranslation = Join-Path $qtRoot "translations\qt_$language.qm"
            if (Test-Path $qtTranslation) {
              Copy-Item $qtTranslation $dist
            }
          }
          $runtimeFiles = @(
            @{ Path = "Qt5Core.dll"; Required = $true },
            @{ Path = "Qt5Gui.dll"; Required = $true },
            @{ Path = "Qt5PrintSupport.dll"; Required = $true },
            @{ Path = "Qt5Widgets.dll"; Required = $true },
            @{ Path = "libgcc_s_seh-1.dll"; Required = $true },
            @{ Path = "libstdc++-6.dll"; Required = $true },
            @{ Path = "libwinpthread-1.dll"; Required = $true },
            @{ Path = "d3dcompiler_47.dll"; Required = $false },
            @{ Path = "opengl32sw.dll"; Required = $false }
          )
          foreach ($runtime in $runtimeFiles) {
            $source = Join-Path $qtBinPath $runtime.Path
            if (-not (Test-Path $source)) {
              if ($runtime.Required) { throw "Required runtime is missing: $source" }
              continue
            }
            Copy-Item $source $dist
          }
          $qtPlugins = @(
            @{ Path = "platforms\qwindows.dll"; Required = $true },
            @{ Path = "printsupport\windowsprintersupport.dll"; Required = $true },
            @{ Path = "styles\qwindowsvistastyle.dll"; Required = $false },
            @{ Path = "imageformats\qgif.dll"; Required = $false },
            @{ Path = "imageformats\qico.dll"; Required = $false },
            @{ Path = "imageformats\qjpeg.dll"; Required = $false }
          )
          foreach ($plugin in $qtPlugins) {
            $source = Join-Path $qtPluginPath $plugin.Path
            if (-not (Test-Path $source)) {
              if ($plugin.Required) { throw "Required Qt plugin is missing: $source" }
              continue
            }
            $destination = Join-Path $dist (Split-Path $plugin.Path -Parent)
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item $source $destination
          }
          $commit = git rev-parse HEAD
          $appHash = (Get-FileHash -Algorithm SHA256 (Join-Path $dist "FreeSSM.exe")).Hash
          $brokerHash = (Get-FileHash -Algorithm SHA256 (Join-Path $dist "j2534_broker.exe")).Hash
          @(
            "commit=$commit"
            "FreeSSM.exe.sha256=$appHash"
            "j2534_broker.exe.sha256=$brokerHash"
          ) | Set-Content -Encoding ascii (Join-Path $dist "BUILD-INFO.txt")

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FreeSSM-J2534-x64
          path: dist/FreeSSM-J2534-x64
          if-no-files-found: error
          retention-days: 14
