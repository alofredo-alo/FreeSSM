name: macOS experimental build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/macos-build.yml'
      - 'FreeSSM.pro'
      - 'FreeSSM_*.ts'
      - 'src/**'
      - 'ui/**'
      - 'definitions/**'
      - 'tests/run_macos_build_smoke.sh'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/macos-build.yml'
      - 'FreeSSM.pro'
      - 'FreeSSM_*.ts'
      - 'src/**'
      - 'ui/**'
      - 'definitions/**'
      - 'tests/run_macos_build_smoke.sh'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt 5.15.2 for Intel macOS
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt mac desktop 5.15.2 clang_64 -O "$RUNNER_TEMP/qt"
          echo "$RUNNER_TEMP/qt/5.15.2/clang_64/bin" >> "$GITHUB_PATH"
      - name: Compile and inspect bundle without hardware
        run: ./tests/run_macos_build_smoke.sh
